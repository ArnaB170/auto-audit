<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAudit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 mt-10">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">AutoAudit</h1>
        
        <p class="text-gray-600 mb-4 text-center">Upload a physical receipt to audit.</p>

        <div class="flex flex-col gap-4 mb-4 w-full">
            <div>
                <label for="start-date" class="block text-sm font-medium text-gray-700">Start Date</label>
                <input type="date" id="start-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
            </div>
            <div>
                <label for="end-date" class="block text-sm font-medium text-gray-700">End Date</label>
                <input type="date" id="end-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
            </div>
        </div>

        <div class="flex flex-col items-center justify-center w-full">
            <label for="receipt-upload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="mb-2 text-sm text-gray-500 font-semibold">Click to Upload Bill</p>
                    <p class="text-xs text-gray-500">Image files only</p>
                </div>
                <input id="receipt-upload" type="file" class="hidden" accept="image/*" capture="environment" />
            </label>
        </div>

        <div id="loading" class="hidden mt-6 text-center text-blue-600 font-semibold">
            Uploading and Auditing...
        </div>

        <div id="result-container" class="mt-6 hidden">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Audit Result:</h2>
            <pre id="result-json" class="bg-gray-100 p-4 rounded-lg text-sm text-gray-800 overflow-x-auto whitespace-pre-wrap"></pre>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('receipt-upload');
        const loadingIndicator = document.getElementById('loading');
        const resultContainer = document.getElementById('result-container');
        const resultJson = document.getElementById('result-json');

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!startDate || !endDate) {
                alert("Please select both start and end dates.");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('start_date', startDate);
            formData.append('end_date', endDate);

            // Show loading, hide previous result
            loadingIndicator.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            resultJson.textContent = '';

            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                resultJson.textContent = JSON.stringify(data, null, 2);
                resultContainer.classList.remove('hidden');
            } catch (error) {
                resultJson.textContent = `Error: ${error.message}`;
                resultContainer.classList.remove('hidden');
            } finally {
                loadingIndicator.classList.add('hidden');
                // Reset file input so the same file can be uploaded again if needed
                fileInput.value = '';
            }
        });
    </script>
</body>
</html>
